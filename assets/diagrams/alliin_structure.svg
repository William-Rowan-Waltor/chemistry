<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" width="100%" height="100%">
  <defs>
    <style>
      .atom { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e6edf3; }
      .bond { stroke: #8b949e; stroke-width: 2.2; stroke-linecap: round; }
      .tag { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #58a6ff; }
    </style>
  </defs>
  <rect width="460" height="170" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="20" y="28" class="tag">Alliin (hợp chất acid amin trong tỏi tươi):</text>

  <g transform="translate(40, 50)">
    <!-- Allyl group: CH2=CH-CH2- -->
    <line x1="15" y1="85" x2="45" y2="60" class="bond"/>
    <line x1="18" y1="90" x2="48" y2="65" class="bond" stroke="#58a6ff"/>
    <line x1="45" y1="60" x2="80" y2="85" class="bond"/>

    <!-- S(=O) atom -->
    <line x1="80" y1="85" x2="110" y2="65" class="bond"/>
    <text x="113" y="70" class="atom" fill="#e3b341">S</text>
    
    <!-- S=O double bond -->
    <line x1="124" y1="75" x2="124" y2="105" class="bond"/>
    <line x1="128" y1="75" x2="128" y2="105" class="bond"/>
    <text x="120" y="125" class="atom" fill="#ff7b72">O</text>

    <!-- S to -CH2-CH(NH2)-COOH -->
    <line x1="130" y1="65" x2="165" y2="85" class="bond"/>
    <line x1="165" y1="85" x2="205" y2="60" class="bond"/>

    <!-- Wedge NH2 -->
    <polygon points="205,60 200,98 210,98" fill="#58a6ff"/>
    <text x="195" y="120" class="atom" fill="#79c0ff">NH<tspan font-size="11" dy="3">2</tspan></text>

    <!-- -COOH -->
    <line x1="205" y1="60" x2="235" y2="35" class="bond"/>
    <text x="240" y="32" class="atom" fill="#7ee787">COOH</text>
  </g>
</svg>