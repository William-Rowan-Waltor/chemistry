      .tail-lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #8b949e; }
    </style>
  </defs>
  <rect width="540" height="160" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <g transform="translate(30, 80)">
