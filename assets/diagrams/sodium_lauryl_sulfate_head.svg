      .txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #e6edf3; }
      .bond { stroke: #58a6ff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .hl-circle { fill: rgba(248, 81, 73, 0.15); stroke: #f85149; stroke-width: 2; stroke-dasharray: 4,4; }
