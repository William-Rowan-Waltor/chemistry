    <line x1="361" y1="12" x2="361" y2="32" class="bond"/>
    <text x="359" y="47" class="txt" text-anchor="middle">O</text>
    <line x1="368" y1="0" x2="395" y2="0" class="bond"/>
    <text x="402" y="5" class="txt">O<tspan font-size="11" dy="-6" fill="#f85149">−</tspan><tspan dy="6"> </tspan><tspan fill="#79c0ff">Na<tspan font-size="11" dy="-6" fill="#79c0ff">+</tspan></tspan></text>
    <ellipse cx="375" cy="5" rx="65" ry="60" class="hl-circle"/>
