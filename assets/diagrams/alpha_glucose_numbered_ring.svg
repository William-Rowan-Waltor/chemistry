<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #e6edf3; }
      .num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #58a6ff; }
      .oh { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #7ee787; }
      .ring { fill: #161b22; stroke: #8b949e; stroke-width: 2; }
      .boldB { stroke: #e6edf3; stroke-width: 3.5; stroke-linecap: round; }
      .tag { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #58a6ff; }
    </style>
  </defs>
  <rect width="420" height="220" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="20" y="28" class="tag">Vòng Haworth của α-glucose (đánh số 1 → 6):</text>

  <g transform="translate(100, 45)">
    <!-- 6-membered pyranose ring -->
    <path d="M 40,45 L 105,25 L 170,45 L 150,110 L 60,110 Z" class="ring"/>
    <line x1="60" y1="110" x2="150" y2="110" class="boldB"/>
    <text x="105" y="23" class="txt" fill="#ff7b72" font-weight="700">O</text>

    <!-- Carbon numbers -->
    <text x="180" y="45" class="num">1</text>
    <text x="160" y="115" class="num">2</text>
    <text x="105" y="125" class="num">3</text>
    <text x="45" y="115" class="num">4</text>
    <text x="25" y="45" class="num">5</text>
    <text x="25" y="10" class="num">6</text>

    <!-- C1: OH down (alpha hemiacetal) -->
    <line x1="170" y1="45" x2="170" y2="80" stroke="#8b949e" stroke-width="1.8"/>
    <text x="170" y="95" class="oh" text-anchor="middle" fill="#f0883e">OH</text>

    <!-- C2: OH down -->
    <line x1="150" y1="110" x2="150" y2="135" stroke="#8b949e" stroke-width="1.8"/>
    <text x="150" y="150" class="oh" text-anchor="middle">OH</text>

    <!-- C3: OH up -->
    <line x1="105" y1="110" x2="105" y2="85" stroke="#8b949e" stroke-width="1.8"/>
    <text x="105" y="80" class="oh" text-anchor="middle">OH</text>

    <!-- C4: OH down -->
    <line x1="60" y1="110" x2="60" y2="135" stroke="#8b949e" stroke-width="1.8"/>
    <text x="60" y="150" class="oh" text-anchor="middle">OH</text>

    <!-- C5: -CH2OH (C6) up -->
    <line x1="40" y1="45" x2="40" y2="15" stroke="#8b949e" stroke-width="1.8"/>
    <text x="40" y="10" class="txt" text-anchor="middle">CH<tspan font-size="10" dy="2">2</tspan><tspan dy="-2">OH</tspan></text>
  </g>
</svg>