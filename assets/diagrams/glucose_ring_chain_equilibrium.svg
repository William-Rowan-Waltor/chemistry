<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="100%">
  <defs>
    <style>
      .lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #58a6ff; }
      .txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #e6edf3; }
      .oh { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #7ee787; }
      .hemi { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #f0883e; }
      .boldBond { stroke: #e6edf3; stroke-width: 3.5; stroke-linecap: round; }
      .thinBond { stroke: #8b949e; stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="720" height="280" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Left: alpha-D-glucopyranose -->
  <g transform="translate(30, 20)">
    <text x="100" y="25" class="lbl" text-anchor="middle">α-glucose (vòng 6 cạnh)</text>
    <text x="140" y="55" class="hemi" text-anchor="middle">Nhóm –OH hemiacetal</text>
    <path d="M 140,62 L 150,88" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Pyranose Haworth Ring -->
    <!-- C5 to O to C1 -->
    <path d="M 60,110 L 105,95 L 150,110 L 135,160 L 75,160 Z" fill="#161b22" stroke="#8b949e" stroke-width="1.8"/>
    <!-- Thick front edge C2-C3-C4 -->
    <line x1="75" y1="160" x2="135" y2="160" class="boldBond"/>
    <text x="105" y="93" class="txt" text-anchor="middle" fill="#ff7b72" font-weight="700">O</text>

    <!-- Substituents -->
    <!-- C1: OH down (alpha) -->
    <line x1="150" y1="110" x2="150" y2="85" class="thinBond"/><text x="150" y="80" class="txt" text-anchor="middle">H</text>
    <line x1="150" y1="110" x2="150" y2="140" class="thinBond"/><text x="150" y="155" class="oh" text-anchor="middle" fill="#f0883e">OH (α)</text>

    <!-- C2: OH down -->
    <line x1="135" y1="160" x2="135" y2="185" class="thinBond"/><text x="135" y="200" class="oh" text-anchor="middle">OH</text>
    <!-- C3: OH up -->
    <line x1="105" y1="160" x2="105" y2="135" class="thinBond"/><text x="105" y="130" class="oh" text-anchor="middle">OH</text>
    <!-- C4: OH down -->
    <line x1="75" y1="160" x2="75" y2="185" class="thinBond"/><text x="75" y="200" class="oh" text-anchor="middle">OH</text>
    <!-- C5: CH2OH up -->
    <line x1="60" y1="110" x2="60" y2="80" class="thinBond"/><text x="60" y="75" class="txt" text-anchor="middle">CH<tspan dy="3" font-size="10">2</tspan><tspan dy="-3">OH</tspan></text>
  </g>

  <!-- Equilibrium arrow 1 -->
  <g transform="translate(245, 125)">
    <line x1="0" y1="-4" x2="35" y2="-4" stroke="#e6edf3" stroke-width="2"/>
    <polygon points="35,-7 42,-4 35,-1" fill="#e6edf3"/>
    <line x1="42" y1="6" x2="7" y2="6" stroke="#e6edf3" stroke-width="2"/>
    <polygon points="7,3 0,6 7,9" fill="#e6edf3"/>
  </g>

  <!-- Center: D-glucose mạch hở (Fischer) -->
  <g transform="translate(320, 20)">
    <text x="40" y="25" class="lbl" text-anchor="middle">Mạch hở (Fischer)</text>
    <g transform="translate(40, 45)">
      <text x="0" y="15" class="txt" text-anchor="middle" fill="#79c0ff" font-weight="700">1  CH=O</text>
      <line x1="0" y1="20" x2="0" y2="40" class="thinBond"/>
      <text x="0" y="45" class="txt" text-anchor="middle">H—2—OH</text>
      <line x1="0" y1="50" x2="0" y2="70" class="thinBond"/>
      <text x="0" y="75" class="txt" text-anchor="middle">HO—3—H</text>
      <line x1="0" y1="80" x2="0" y2="100" class="thinBond"/>
      <text x="0" y="105" class="txt" text-anchor="middle">H—4—OH</text>
      <line x1="0" y1="110" x2="0" y2="130" class="thinBond"/>
      <text x="0" y="135" class="txt" text-anchor="middle">H—5—OH</text>
      <line x1="0" y1="140" x2="0" y2="160" class="thinBond"/>
      <text x="0" y="175" class="txt" text-anchor="middle">6  CH<tspan dy="3" font-size="10">2</tspan><tspan dy="-3">OH</tspan></text>
    </g>
  </g>

  <!-- Equilibrium arrow 2 -->
  <g transform="translate(435, 125)">
    <line x1="0" y1="-4" x2="35" y2="-4" stroke="#e6edf3" stroke-width="2"/>
    <polygon points="35,-7 42,-4 35,-1" fill="#e6edf3"/>
    <line x1="42" y1="6" x2="7" y2="6" stroke="#e6edf3" stroke-width="2"/>
    <polygon points="7,3 0,6 7,9" fill="#e6edf3"/>
  </g>

  <!-- Right: beta-D-glucopyranose -->
  <g transform="translate(500, 20)">
    <text x="100" y="25" class="lbl" text-anchor="middle">β-glucose (vòng 6 cạnh)</text>
    <text x="140" y="55" class="hemi" text-anchor="middle">Nhóm –OH hemiacetal</text>
    <path d="M 140,62 L 150,75" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Pyranose Ring -->
    <path d="M 60,110 L 105,95 L 150,110 L 135,160 L 75,160 Z" fill="#161b22" stroke="#8b949e" stroke-width="1.8"/>
    <line x1="75" y1="160" x2="135" y2="160" class="boldBond"/>
    <text x="105" y="93" class="txt" text-anchor="middle" fill="#ff7b72" font-weight="700">O</text>

    <!-- C1: OH up (beta!) -->
    <line x1="150" y1="110" x2="150" y2="80" class="thinBond"/><text x="150" y="75" class="oh" text-anchor="middle" fill="#f0883e">OH (β)</text>
    <line x1="150" y1="110" x2="150" y2="135" class="thinBond"/><text x="150" y="145" class="txt" text-anchor="middle">H</text>

    <!-- C2: OH down -->
    <line x1="135" y1="160" x2="135" y2="185" class="thinBond"/><text x="135" y="200" class="oh" text-anchor="middle">OH</text>
    <!-- C3: OH up -->
    <line x1="105" y1="160" x2="105" y2="135" class="thinBond"/><text x="105" y="130" class="oh" text-anchor="middle">OH</text>
    <!-- C4: OH down -->
    <line x1="75" y1="160" x2="75" y2="185" class="thinBond"/><text x="75" y="200" class="oh" text-anchor="middle">OH</text>
    <!-- C5: CH2OH up -->
    <line x1="60" y1="110" x2="60" y2="80" class="thinBond"/><text x="60" y="75" class="txt" text-anchor="middle">CH<tspan dy="3" font-size="10">2</tspan><tspan dy="-3">OH</tspan></text>
  </g>
</svg>