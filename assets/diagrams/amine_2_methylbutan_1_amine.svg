<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 17px; font-weight: 600; fill: #e6edf3; }
      .num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #58a6ff; }
      .sub { font-size: 13px; }
      .bond { stroke: #8b949e; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="460" height="140" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- Numbers above carbons -->
  <text x="50" y="32" class="num" text-anchor="middle">4</text>
  <text x="140" y="32" class="num" text-anchor="middle">3</text>
  <text x="235" y="32" class="num" text-anchor="middle">2</text>
  <text x="325" y="32" class="num" text-anchor="middle">1</text>
  
  <!-- Main chain atoms -->
  <text x="50" y="65" class="txt" text-anchor="middle">CH<tspan class="sub" dy="4">3</tspan></text>
  <line x1="78" y1="60" x2="112" y2="60" class="bond"/>
  
  <text x="140" y="65" class="txt" text-anchor="middle">CH<tspan class="sub" dy="4">2</tspan></text>
  <line x1="168" y1="60" x2="212" y2="60" class="bond"/>
  
  <text x="235" y="65" class="txt" text-anchor="middle">CH</text>
  <line x1="258" y1="60" x2="298" y2="60" class="bond"/>
  
  <text x="325" y="65" class="txt" text-anchor="middle">CH<tspan class="sub" dy="4">2</tspan></text>
  <line x1="352" y1="60" x2="388" y2="60" class="bond"/>
  
  <text x="415" y="65" class="txt" text-anchor="middle" fill="#7ee787">NH<tspan class="sub" dy="4">2</tspan></text>
  
  <!-- Branch at C2 -->
  <line x1="235" y1="73" x2="235" y2="98" class="bond"/>
  <text x="235" y="118" class="txt" text-anchor="middle">CH<tspan class="sub" dy="4">3</tspan></text>
</svg>