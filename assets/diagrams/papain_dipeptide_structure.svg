<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="100%" height="100%">
  <defs>
    <style>
      .atom { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e6edf3; }
      .bond { stroke: #8b949e; stroke-width: 2.2; stroke-linecap: round; }
      .ring { fill: none; stroke: #e6edf3; stroke-width: 2; stroke-linecap: round; }
      .tag { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #58a6ff; }
    </style>
  </defs>
  <rect width="460" height="200" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="20" y="28" class="tag">Cấu trúc chuỗi dipeptide trong Papain (đu đủ):</text>

  <g transform="translate(30, 45)">
    <!-- Imidazole / Histidine 5-membered ring -->
    <g transform="translate(30, 70)">
      <polygon points="0,20 20,-10 50,0 50,35 15,45" class="ring"/>
      <!-- NH atom in ring -->
      <text x="2" y="50" class="atom" fill="#79c0ff">NH</text>
      <!-- N atom in ring -->
      <text x="45" y="10" class="atom" fill="#79c0ff">N</text>
      <!-- Ring double bonds -->
      <line x1="22" y1="-5" x2="44" y2="3" stroke="#58a6ff" stroke-width="2"/>
    </g>

    <!-- Side chain connecting ring to peptide backbone -->
    <line x1="80" y1="88" x2="120" y2="88" class="bond"/>
    <line x1="120" y1="88" x2="145" y2="55" class="bond"/>

    <!-- Alpha Carbon -->
    <!-- Carboxyl branch -COOH -->
    <line x1="145" y1="55" x2="175" y2="75" class="bond"/>
    <line x1="173" y1="75" x2="173" y2="105" class="bond"/>
    <line x1="177" y1="75" x2="177" y2="105" class="bond"/>
    <text x="170" y="125" class="atom" fill="#ff7b72">O</text>
    <line x1="175" y1="75" x2="205" y2="60" class="bond"/>
    <text x="210" y="65" class="atom" fill="#7ee787">OH</text>

    <!-- Peptide NH-CO link -->
    <line x1="145" y1="55" x2="145" y2="25" class="bond"/>
    <text x="135" y="18" class="atom" fill="#79c0ff">HN</text>
    
    <line x1="155" y1="12" x2="190" y2="12" class="bond"/>
    <text x="195" y="18" class="atom">C</text>
    <line x1="198" y1="20" x2="198" y2="45" class="bond"/>
    <line x1="202" y1="20" x2="202" y2="45" class="bond"/>
    <text x="195" y="62" class="atom" fill="#ff7b72">O</text>

    <!-- Remaining chain to -NH2 -->
    <line x1="210" y1="12" x2="245" y2="12" class="bond"/>
    <line x1="245" y1="12" x2="270" y2="38" class="bond"/>
    <line x1="270" y1="38" x2="300" y2="12" class="bond"/>
    <text x="305" y="18" class="atom" fill="#79c0ff">H<tspan font-size="11" dy="3">2</tspan><tspan dy="-3">N</tspan></text>
  </g>
</svg>