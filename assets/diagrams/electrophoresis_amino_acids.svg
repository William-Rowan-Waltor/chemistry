<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 310" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #58a6ff; }
      .lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #e6edf3; }
      .pole-neg { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #79c0ff; }
      .pole-pos { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #ff7b72; }
      .bandTxt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect width="650" height="310" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Left setup: Ban đầu -->
  <g transform="translate(30, 25)">
    <text x="140" y="20" class="hdr" text-anchor="middle">Ban đầu (pH = 6)</text>
    <!-- Power supply -->
    <rect x="95" y="40" width="90" height="30" rx="5" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
    <text x="140" y="60" class="lbl" text-anchor="middle" font-size="12">Nguồn điện</text>
    <!-- Circuit wires -->
    <path d="M 95,55 L 40,55 L 40,110" fill="none" stroke="#79c0ff" stroke-width="2"/>
    <path d="M 185,55 L 240,55 L 240,110" fill="none" stroke="#ff7b72" stroke-width="2"/>
    <text x="40" y="100" class="pole-neg" text-anchor="middle">(-)</text>
    <text x="240" y="100" class="pole-pos" text-anchor="middle">(+)</text>

    <!-- Electrophoresis tank -->
    <rect x="30" y="110" width="220" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <!-- Cathode plate -->
    <rect x="45" y="125" width="12" height="80" rx="2" fill="#1f6feb"/>
    <text x="51" y="222" class="pole-neg" text-anchor="middle">cathode</text>
    <!-- Anode plate -->
    <rect x="223" y="125" width="12" height="80" rx="2" fill="#da3633"/>
    <text x="229" y="222" class="pole-pos" text-anchor="middle">anode</text>

    <!-- Initial sample spot in center -->
    <rect x="130" y="130" width="20" height="70" rx="3" fill="#d29922"/>
    <line x1="140" y1="205" x2="140" y2="245" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="140" y="260" class="lbl" text-anchor="middle" font-weight="600">Vệt mẫu ban đầu</text>
    <text x="140" y="278" class="lbl" text-anchor="middle" fill="#8b949e">(chứa Ala, Lys, Glu)</text>
  </g>

  <!-- Divider -->
  <line x1="330" y1="20" x2="330" y2="290" stroke="#30363d" stroke-dasharray="4,4"/>

  <!-- Right setup: Kết thúc -->
  <g transform="translate(350, 25)">
    <text x="140" y="20" class="hdr" text-anchor="middle">Kết thúc điện di</text>
    <!-- Power supply -->
    <rect x="95" y="40" width="90" height="30" rx="5" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
    <text x="140" y="60" class="lbl" text-anchor="middle" font-size="12">Nguồn điện</text>
    <!-- Circuit wires -->
    <path d="M 95,55 L 40,55 L 40,110" fill="none" stroke="#79c0ff" stroke-width="2"/>
    <path d="M 185,55 L 240,55 L 240,110" fill="none" stroke="#ff7b72" stroke-width="2"/>
    <text x="40" y="100" class="pole-neg" text-anchor="middle">(-)</text>
    <text x="240" y="100" class="pole-pos" text-anchor="middle">(+)</text>

    <!-- Tank -->
    <rect x="30" y="110" width="220" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="45" y="125" width="12" height="80" rx="2" fill="#1f6feb"/>
    <text x="51" y="222" class="pole-neg" text-anchor="middle">cathode</text>
    <rect x="223" y="125" width="12" height="80" rx="2" fill="#da3633"/>
    <text x="229" y="222" class="pole-pos" text-anchor="middle">anode</text>

    <!-- Three separated bands -->
    <!-- Band (1): Migrated towards cathode (-) -> Lys+ -->
    <rect x="85" y="130" width="14" height="70" rx="2" fill="#238636"/>
    <text x="92" y="220" class="bandTxt" text-anchor="middle" fill="#7ee787">(1)</text>

    <!-- Band (2): Stayed in middle -> Ala -->
    <rect x="133" y="130" width="14" height="70" rx="2" fill="#d29922"/>
    <text x="140" y="220" class="bandTxt" text-anchor="middle" fill="#e3b341">(2)</text>

    <!-- Band (3): Migrated towards anode (+) -> Glu- -->
    <rect x="180" y="130" width="14" height="70" rx="2" fill="#a371f7"/>
    <text x="187" y="220" class="bandTxt" text-anchor="middle" fill="#d2a8ff">(3)</text>

    <!-- Explanation below -->
    <text x="140" y="255" class="lbl" text-anchor="middle" font-weight="700">Thứ tự vệt (1), (2), (3):</text>
    <text x="140" y="275" class="lbl" text-anchor="middle" fill="#7ee787">Lys (1) <tspan fill="#8b949e">→</tspan> <tspan fill="#e3b341">Ala (2)</tspan> <tspan fill="#8b949e">→</tspan> <tspan fill="#d2a8ff">Glu (3)</tspan></text>
  </g>
</svg>