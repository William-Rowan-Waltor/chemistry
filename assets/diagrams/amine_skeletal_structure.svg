<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #79c0ff; }
      .bond { stroke: #e6edf3; stroke-width: 2.5; stroke-linecap: round; }
      .tag { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #58a6ff; }
    </style>
  </defs>
  <rect width="340" height="140" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="20" y="28" class="tag">Công thức khung phân tử của amine:</text>

  <g transform="translate(60, 45)">
    <!-- Left ethyl: CH3-CH2- -->
    <line x1="20" y1="65" x2="55" y2="35" class="bond"/>
    <line x1="55" y1="35" x2="95" y2="60" class="bond"/>

    <!-- Central NH -->
    <text x="105" y="66" class="txt" text-anchor="middle">NH</text>

    <!-- Right ethyl: -CH2-CH3 -->
    <line x1="125" y1="60" x2="165" y2="35" class="bond"/>
    <line x1="165" y1="35" x2="200" y2="65" class="bond"/>
  </g>
</svg>