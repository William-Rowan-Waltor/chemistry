<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <style>
      .atom { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #e6edf3; }
      .bond { stroke: #8b949e; stroke-width: 2.2; stroke-linecap: round; }
      .ring { fill: none; stroke: #e6edf3; stroke-width: 2; }
      .head { fill: #f85149; font-weight: 700; font-size: 14px; }
      .tag { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; }
    </style>
  </defs>
  <rect width="540" height="180" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="20" y="30" class="tag" fill="#58a6ff">Sodium dodecylbenzenesulfonate (SDBS):</text>
  
  <!-- Hydrophobic tail: 12 Carbon Zig-Zag -->
  <g transform="translate(30, 95)">
    <path d="M 0,0 L 15,-15 L 30,0 L 45,-15 L 60,0 L 75,-15 L 90,0 L 105,-15 L 120,0 L 135,-15 L 150,0 L 165,-15 L 180,0 L 195,-15 L 210,0 L 225,-15 L 240,0" 
          fill="none" stroke="#79c0ff" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="120" y="30" class="tag" fill="#79c0ff" text-anchor="middle">Mạch hydrocarbon kị nước: C12H25–</text>
  </g>

  <!-- Benzene ring -->
  <g transform="translate(285, 95)">
    <!-- Connection bond -->
    <line x1="-15" y1="0" x2="0" y2="0" class="bond"/>
    <!-- Regular hexagon -->
    <polygon points="0,0 20,-30 55,-30 75,0 55,30 20,30" class="ring"/>
    <!-- Inner aromatic circle -->
    <circle cx="37.5" cy="0" r="17" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3,2"/>
    
    <!-- Bond to SO3- Na+ -->
    <line x1="75" y1="0" x2="105" y2="0" class="bond"/>

    <!-- Sulfonate head -->
    <text x="110" y="6" class="atom" fill="#ff7b72">S</text>
    <!-- O double bonds -->
    <line x1="117" y1="-8" x2="117" y2="-25" class="bond"/>
    <line x1="121" y1="-8" x2="121" y2="-25" class="bond"/>
    <text x="115" y="-30" class="atom" fill="#ff7b72">O</text>

    <line x1="117" y1="12" x2="117" y2="29" class="bond"/>
    <line x1="121" y1="12" x2="121" y2="29" class="bond"/>
    <text x="115" y="45" class="atom" fill="#ff7b72">O</text>

    <!-- O- Na+ -->
    <line x1="126" y1="0" x2="148" y2="0" class="bond"/>
    <text x="152" y="6" class="atom" fill="#7ee787">O<tspan dy="-6" font-size="11">⁻</tspan><tspan dy="6"> </tspan>Na<tspan dy="-6" font-size="11">⁺</tspan></text>
    
    <text x="135" y="68" class="tag" fill="#7ee787" text-anchor="middle">Đầu ưa nước</text>
  </g>
</svg>