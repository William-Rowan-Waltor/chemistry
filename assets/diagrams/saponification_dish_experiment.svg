<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="100%" height="100%">
  <defs>
    <style>
      .lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #e6edf3; }
      .hl { font-weight: 700; fill: #58a6ff; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="520" height="250" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Left: Dish and mesh on tripod -->
  <g transform="translate(50, 40)">
    <!-- Wire gauze grid -->
    <ellipse cx="140" cy="115" rx="70" ry="15" fill="#21262d" stroke="#6e7681" stroke-width="2"/>
    <path d="M 80,115 L 200,115 M 100,105 L 180,125 M 100,125 L 180,105" stroke="#8b949e" stroke-width="1"/>

    <!-- Ceramic dish -->
    <path d="M 75,95 Q 140,150 205,95 Q 140,85 75,95 Z" fill="#f0f6fc" stroke="#8b949e" stroke-width="2.5"/>
    <path d="M 88,100 Q 140,135 192,100 Q 140,92 88,100 Z" fill="#d29922" opacity="0.85"/>

    <!-- Stirring rod -->
    <line x1="200" y1="20" x2="135" y2="115" stroke="#79c0ff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <!-- Rotation arrow -->
    <path d="M 185,15 A 15 15 0 1 1 170,30" class="arrow"/>
    <polygon points="172,34 167,26 176,27" fill="#58a6ff"/>
  </g>

  <!-- Right: Labels -->
  <g transform="translate(290, 60)">
    <text x="0" y="20" class="lbl hl" font-size="15">Thí nghiệm xà phòng hoá:</text>
    <text x="0" y="55" class="lbl">🔄 <tspan font-weight="700">Liên tục khuấy</tspan> bằng đũa thuỷ tinh</text>
    <text x="0" y="85" class="lbl">🧪 Hỗn hợp phản ứng gồm:</text>
    <text x="20" y="110" class="lbl">• 1 mL dầu ăn (hoặc mỡ lợn)</text>
    <text x="20" y="135" class="lbl">• 3 mL dung dịch NaOH 40% đặc</text>
    <text x="0" y="165" class="lbl" fill="#7ee787">✓ Thỉnh thoảng thêm vài giọt nước cất</text>
  </g>
</svg>