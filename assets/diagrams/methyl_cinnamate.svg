<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" width="100%" height="100%">
  <defs>
    <style>
      .atom { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #e6edf3; }
      .bond { stroke: #e6edf3; stroke-width: 2.2; stroke-linecap: round; }
      .tag { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #58a6ff; }
    </style>
  </defs>
  <rect width="460" height="170" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="20" y="28" class="tag">Methyl cinnamate (mùi dâu tây):</text>

  <g transform="translate(40, 60)">
    <!-- Benzene ring -->
    <polygon points="40,30 20,65 40,100 80,100 100,65 80,30" fill="none" stroke="#e6edf3" stroke-width="2"/>
    <circle cx="60" cy="65" r="22" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Trans C=C chain -->
    <line x1="100" y1="65" x2="135" y2="45" class="bond"/>
    <!-- Double bond -->
    <line x1="135" y1="45" x2="175" y2="70" class="bond"/>
    <line x1="137" y1="38" x2="173" y2="61" class="bond" stroke="#58a6ff"/>
    
    <!-- Bond to C=O -->
    <line x1="175" y1="70" x2="215" y2="45" class="bond"/>
    
    <!-- Carbonyl C=O -->
    <line x1="213" y1="45" x2="213" y2="12" class="bond"/>
    <line x1="217" y1="45" x2="217" y2="12" class="bond"/>
    <text x="210" y="7" class="atom" fill="#ff7b72">O</text>

    <!-- Bond to -OCH3 -->
    <line x1="215" y1="45" x2="245" y2="62" class="bond"/>
    <text x="250" y="72" class="atom" fill="#7ee787">OCH<tspan font-size="12" dy="3">3</tspan></text>
  </g>
</svg>