<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <defs>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="50%" stop-color="#ffdd00"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="soapCake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3b341" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d29922" stop-opacity="0.95"/>
    </linearGradient>
    <style>
      .lbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #e6edf3; }
      .sublbl { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #8b949e; }
      .hl { font-weight: 700; fill: #58a6ff; }
      .layerTxt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; }
    </style>
  </defs>
  <rect width="680" height="320" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Left: Đun cách thủy/nóng xà phòng hóa trong bát sứ -->
  <g transform="translate(40, 20)">
    <!-- Tripod / Giá kiềng -->
    <path d="M 110,210 L 60,285 M 190,210 L 240,285 M 150,210 L 150,285" stroke="#484f58" stroke-width="4"/>
    <ellipse cx="150" cy="210" rx="55" ry="12" fill="none" stroke="#6e7681" stroke-width="4"/>
    <!-- Wire gauze / Lưới amiang -->
    <ellipse cx="150" cy="208" rx="50" ry="10" fill="#30363d" stroke="#8b949e" stroke-width="1"/>

    <!-- Spirit lamp / Đèn cồn -->
    <path d="M 125,280 L 175,280 L 170,250 L 130,250 Z" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
    <rect x="144" y="240" width="12" height="10" fill="#6e7681"/>
    <!-- Flame -->
    <path d="M 150,240 C 138,225 142,205 150,195 C 158,205 162,225 150,240 Z" fill="url(#flame)"/>

    <!-- Ceramic dish / Bát sứ -->
    <path d="M 85,180 Q 150,235 215,180 Q 150,170 85,180 Z" fill="#f0f6fc" stroke="#8b949e" stroke-width="2.5"/>
    <!-- Liquid in dish -->
    <path d="M 98,185 Q 150,220 202,185 Q 150,178 98,185 Z" fill="url(#liquidGrad)"/>

    <!-- Stirring rod / Đũa thủy tinh -->
    <line x1="175" y1="100" x2="135" y2="195" stroke="#79c0ff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

    <!-- Dropper / Ống hút nhỏ giọt thêm nước cất -->
    <g transform="translate(60, 40)">
      <rect x="25" y="10" width="8" height="45" fill="#58a6ff" opacity="0.4" stroke="#58a6ff" stroke-width="1.5"/>
      <path d="M 23,55 L 29,80 L 35,55 Z" fill="#58a6ff" opacity="0.6"/>
      <ellipse cx="29" cy="8" rx="8" ry="6" fill="#f85149"/>
      <!-- Water droplet -->
      <circle cx="29" cy="92" r="3" fill="#79c0ff"/>
      <circle cx="29" cy="104" r="3.5" fill="#79c0ff"/>
      <text x="42" y="35" class="lbl">Nước cất</text>
      <text x="42" y="52" class="sublbl">(giữ thể tích không đổi)</text>
    </g>

    <!-- Labels for dish setup -->
    <text x="210" y="115" class="lbl">Đũa thuỷ tinh</text>
    <text x="210" y="132" class="sublbl">liên tục khuấy hỗn hợp</text>
    <path d="M 205,120 L 165,135" stroke="#8b949e" stroke-dasharray="3,3"/>

    <text x="225" y="175" class="lbl hl">Bát sứ chứa:</text>
    <text x="225" y="193" class="lbl">1g mỡ/dầu thực vật</text>
    <text x="225" y="210" class="lbl">+ 2-2.5 mL dd NaOH 40%</text>
  </g>

  <!-- Divider line -->
  <line x1="390" y1="30" x2="390" y2="290" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Right: Rót NaCl bão hòa vào cốc & tách lớp -->
  <g transform="translate(420, 20)">
    <text x="120" y="30" class="lbl hl" text-anchor="middle" font-size="15">Sau khi thêm NaCl bão hoà:</text>
    
    <!-- Test tube pouring NaCl -->
    <g transform="translate(30, 45) rotate(35)">
      <rect x="0" y="0" width="18" height="70" rx="9" fill="rgba(88,166,255,0.25)" stroke="#58a6ff" stroke-width="2"/>
      <line x1="9" y1="45" x2="9" y2="85" stroke="#79c0ff" stroke-width="2.5" stroke-dasharray="4,2"/>
    </g>
    <text x="100" y="65" class="lbl">Dung dịch NaCl bão hoà</text>

    <!-- Beaker / Cốc thuỷ tinh -->
    <path d="M 60,110 L 60,250 Q 60,265 75,265 L 165,265 Q 180,265 180,250 L 180,110" fill="none" stroke="#8b949e" stroke-width="3"/>
    
    <!-- Bottom layer Y: dd Glycerol + NaCl -->
    <path d="M 62,175 L 62,250 Q 62,263 75,263 L 165,263 Q 178,263 178,250 L 178,175 Z" fill="#1f6feb" opacity="0.35"/>
    <text x="120" y="225" class="layerTxt" fill="#79c0ff" text-anchor="middle">Lớp Y</text>
    <text x="120" y="243" class="sublbl" text-anchor="middle" fill="#a5d6ff">(Glycerol + dd NaCl bão hoà)</text>

    <!-- Top layer X: Bánh xà phòng đóng nổi lên trên -->
    <rect x="62" y="145" width="116" height="30" rx="4" fill="url(#soapCake)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="120" y="165" class="layerTxt" fill="#0d1117" text-anchor="middle">Lớp X: Bánh xà phòng</text>

    <!-- Pointer X and Y -->
    <line x1="185" y1="160" x2="225" y2="160" stroke="#f0f6fc" stroke-width="2"/>
    <text x="232" y="165" class="lbl" fill="#f0f6fc" font-weight="700">Lớp X</text>
    <text x="232" y="180" class="sublbl">Muối Na của acid béo</text>

    <line x1="185" y1="220" x2="225" y2="220" stroke="#79c0ff" stroke-width="2"/>
    <text x="232" y="225" class="lbl" fill="#79c0ff" font-weight="700">Lớp Y</text>
    <text x="232" y="240" class="sublbl">Chứa glycerol &amp; NaCl</text>
  </g>
</svg>